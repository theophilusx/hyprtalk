[project]
name = "hyprtalk"
version = "0.1.0"
description = "Speech feedback daemon for the Hyprland Wayland compositor"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
hyprtalk = "hyprtalk.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.uv]
system-site-packages = true
